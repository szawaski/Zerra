# Builds the framework and runs the tests, the repository and messaging tests against the data stores and brokers in Demo/Infrastructure/docker-compose.yml.
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Build the framework
        run: |
          for project in Framework/*/*.csproj; do
            dotnet build "$project"
          done

      - name: Build the tests
        run: |
          dotnet build Tests/Zerra.Test/Zerra.Test.csproj
          dotnet build Tests/Zerra.SourceGeneration.Test/Zerra.SourceGeneration.Test.csproj
          for project in Demo/Store/*.Test/*.csproj; do
            dotnet build "$project"
          done

      - name: Zerra.Test
        run: dotnet Tests/Zerra.Test/bin/Debug/net11.0/Zerra.Test.dll

      - name: Zerra.SourceGeneration.Test
        run: dotnet Tests/Zerra.SourceGeneration.Test/bin/Debug/net11.0/Zerra.SourceGeneration.Test.dll

      - name: Store demo tests
        run: |
          for project in Demo/Store/*.Test/*.csproj; do
            name=$(basename "$project" .csproj)
            dotnet "$(dirname "$project")/bin/Debug/net11.0/$name.dll"
          done

  repository:
    name: Repository tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Start the data stores
        run: docker compose -f Demo/Infrastructure/docker-compose.yml up -d --wait mssql mysql mariadb postgresql mongodb kurrentdb

      #KurrentDB has no healthcheck in the compose file, so wait for its HTTP endpoint
      - name: Wait for KurrentDB
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:2113/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "KurrentDB did not start"
          exit 1

      - name: Build
        run: dotnet build Tests/Zerra.Repository.Test/Zerra.Repository.Test.csproj

      - name: Zerra.Repository.Test
        run: dotnet Tests/Zerra.Repository.Test/bin/Debug/net11.0/Zerra.Repository.Test.dll

      - name: Data store logs
        if: failure()
        run: docker compose -f Demo/Infrastructure/docker-compose.yml logs --tail 200

  messaging:
    name: Messaging tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Start the brokers
        run: docker compose -f Demo/Infrastructure/docker-compose.yml up -d --wait kafka rabbitmq servicebus-sql servicebus

      #the Service Bus emulator has no healthcheck in its image, so wait for its health endpoint
      - name: Wait for the Service Bus emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5300/health > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "The Service Bus emulator did not start"
          exit 1

      - name: Build
        run: dotnet build Tests/Zerra.CQRS.Test/Zerra.CQRS.Test.csproj

      #the sustained load tests are too heavy for CI, they run locally
      - name: Zerra.CQRS.Test
        run: dotnet Tests/Zerra.CQRS.Test/bin/Debug/net11.0/Zerra.CQRS.Test.dll -method- "*.TestSustainedLoad"

      - name: Broker logs
        if: failure()
        run: docker compose -f Demo/Infrastructure/docker-compose.yml logs --tail 200

  aot:
    name: Native AOT (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      #any trimming or AOT warning fails the job, it means something wasn't generated
      - name: Publish as Native AOT
        run: |
          dotnet publish Tests/Zerra.AotTest/Zerra.AotTest.csproj -c Release -r linux-x64 2>&1 | tee publish.log
          if grep -E "warning (IL|AOT)" publish.log; then
            echo "Trimming or AOT warnings"
            exit 1
          fi

      - name: Zerra.AotTest
        run: Tests/Zerra.AotTest/bin/Release/net11.0/linux-x64/publish/Zerra.AotTest

  windows:
    name: .NET Framework tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build Tests/Zerra.Test.NetStandard/Zerra.Test.NetStandard.csproj

      - name: Zerra.Test.NetStandard (net48)
        run: Tests/Zerra.Test.NetStandard/bin/Debug/net48/Zerra.Test.NetStandard.exe
